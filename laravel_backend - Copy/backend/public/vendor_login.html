<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login - Thambapanni Sobha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            margin-bottom: 20px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .vendor-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fas fa-store fa-3x mb-3"></i>
                        <h3>Vendor Login</h3>
                        <p class="mb-0">Thambapanni Sobha Dashboard</p>
                    </div>
                    <div class="login-body">
                        <div class="vendor-info">
                            <h6><i class="fas fa-info-circle"></i> Test Vendor Credentials:</h6>
                            <p class="mb-1"><strong>Email:</strong> testvendor@example.com</p>
                            <p class="mb-1"><strong>Password:</strong> password123</p>
                            <small class="text-muted">Or use: vendor@example.com / password123</small>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope"></i> Email Address
                                </label>
                                <input type="email" class="form-control" id="email" value="testvendor@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock"></i> Password
                                </label>
                                <input type="password" class="form-control" id="password" value="password123" required>
                            </div>
                            <div class="mb-3">
                                <div id="loginMessage"></div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-login w-100">
                                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                After login, you'll be redirected to the Vendor Dashboard
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Enhanced AuthAPI with proper session handling
        class VendorAuthAPI {
            constructor() {
                this.baseURL = 'http://localhost:8000/api';
                this.token = localStorage.getItem('auth_token');
            }

            getHeaders() {
                return {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    ...(this.token && { 'Authorization': `Bearer ${this.token}` })
                };
            }

            storeAuthData(data) {
                console.log('🔄 Storing vendor auth data:', data);
                
                // Store all authentication data
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('user_role', data.user.role);
                this.token = data.token;
                
                // Store additional session info
                localStorage.setItem('login_time', new Date().toISOString());
                localStorage.setItem('session_active', 'true');
                
                console.log('✅ Vendor auth data stored successfully');
                console.log('Token:', data.token ? 'Present' : 'Missing');
                console.log('User:', data.user.name, '(' + data.user.email + ')');
                console.log('Role:', data.user.role);
            }

            clearAuthData() {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user');
                localStorage.removeItem('user_role');
                localStorage.removeItem('login_time');
                localStorage.removeItem('session_active');
                this.token = null;
                console.log('🗑️ Auth data cleared');
            }

            isAuthenticated() {
                const token = localStorage.getItem('auth_token');
                const user = localStorage.getItem('user');
                const sessionActive = localStorage.getItem('session_active');
                
                return !!(token && user && sessionActive === 'true');
            }

            async login(email, password) {
                try {
                    console.log('🔐 Attempting vendor login for:', email);
                    
                    const response = await fetch(`${this.baseURL}/auth/login`, {
                        method: 'POST',
                        headers: this.getHeaders(),
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();
                    console.log('📡 Login response:', data);
                    
                    if (data.success && data.user) {
                        this.storeAuthData(data);
                        return { success: true, data };
                    } else {
                        return { success: false, error: data.message || 'Login failed' };
                    }
                } catch (error) {
                    console.error('❌ Login error:', error);
                    return { success: false, error: error.message };
                }
            }
        }

        const vendorAuth = new VendorAuthAPI();

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('loginMessage');
            
            // Show loading state
            messageDiv.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin"></i> Logging in...</div>';
            
            try {
                const result = await vendorAuth.login(email, password);
                
                if (result.success) {
                    const user = result.data.user;
                    messageDiv.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i> Login successful!
                            <br><strong>Welcome ${user.name}</strong>
                            <br>Role: ${user.role}
                            <br>Redirecting to dashboard...
                        </div>
                    `;
                    
                    // Redirect to dashboard after 2 seconds
                    setTimeout(() => {
                        // Try to redirect to the actual dashboard page
                        // Adjust this URL to match your dashboard route
                        window.location.href = '/dashboard.html'; // or wherever your dashboard is
                    }, 2000);
                    
                } else {
                    messageDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> Login failed: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                messageDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i> Error: ${error.message}
                    </div>
                `;
            }
        });

        // Check if already logged in
        window.addEventListener('load', function() {
            if (vendorAuth.isAuthenticated()) {
                const user = JSON.parse(localStorage.getItem('user'));
                document.getElementById('loginMessage').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> Already logged in as ${user.name} (${user.role})
                        <br><a href="/dashboard.html" class="btn btn-sm btn-primary mt-2">Go to Dashboard</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
